# Docker Compose for optional infrastructure services
# NOTE: Not required! The project runs with SQLite + in-memory by default.
#
# Start with: docker compose up -d postgres redis meilisearch
# Then set environment variables in medusa-backend/.env to use them.

version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: magnet-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-magnet_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-magnet_pass}
      POSTGRES_DB: ${DB_NAME:-magnet_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: magnet-redis
    ports:
      - "6379:6379"

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: magnet-meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-magnet_master_key}
    ports:
      - "7700:7700"

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
